services:
  - type: web
    name: ocean-pulse
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build && cd apps/api && npx prisma db push --accept-data-loss
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: "fallback"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: ocean-pulse-db
          property: connectionString

databases:
  - name: ocean-pulse-db
    plan: free
    region: singapore
    databaseName: oceanpulse
    user: oceanpulse_admin
